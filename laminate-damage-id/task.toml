[task]
name = "afterquery/laminate-damage-id"
description = "Identify a breathing midplane split and uncertain edge restraint from unlabeled postbuckling vibration records, then forecast the closed-branch snap and the open-branch spectrum off the measured holds."
authors = [{ name = "Nishant Kumar Saroj", email = "nishantsaroj20@gmail.com" }]
keywords = ["composites", "laminates", "damage-identification", "modal-analysis", "inverse-problem", "GFRP", "SHM"]

[metadata]
author_name = "Nishant Kumar Saroj"
