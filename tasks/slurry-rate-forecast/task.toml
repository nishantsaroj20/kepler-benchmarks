tags = ["slurry reactor", "hydrogenation", "mass transfer", "Langmuir-Hinshelwood", "pilot plant"]
expert_time_estimate_hours = 6.0
relevant_experience = "Pilot-scale multiphase reaction engineering: reconciling autoclave instrument records, separating gas-liquid, liquid-solid, and intraparticle hydrogen transport from intrinsic catalytic kinetics, and integrating a closed headspace over the next slurry charge."
difficulty_explanation = """
A reaction engineer who sets the next charges on a stirred slurry hydrogenation autoclave does this work. The campaigns are synthetic. The visible week is a 1.5 L toluene hydrogenation over uniform Pd/C. The records include relative hydrogen-uptake noise, a curved thermocouple table, three chromatograph windows, a spreadsheet column left on an old factor, an aborted export, a blank tachometer row, a dissolution row taken with the baffles out, a regenerated catalyst state, and a forecast hold that empties a small headspace. The crushed aliquot is faster than the whole particle, and the 120 µm and 420 µm charges do not take up hydrogen at the same rate. The held-out campaign is a different fill, not another draw from that week: anisole, a lower diffusivity, larger particles, stirrer speeds and diameters outside the visible window, its own curved thermocouple and chromatograph calendar, aborted rows, and holds that empty a small headspace. Those same conditions are already in the visible week. The campaign note states the Langmuir-Hinshelwood rate, the two temperature laws, the steady particle balance, and the closed-headspace inventory. The hard part is carrying that model out. The corrected rates identify the four constants. The local rate is solved against diffusion inside the sphere and matched to the two films. Consumption over the hold is the integral of the falling hydrogen inventory, and it stops at zero partial pressure. Dropping the particle diffusion, or treating the hold as the initial rate times time, leaves most of the map outside the stated tolerances. The forecast also has to finish within the stated 20 seconds on 1 CPU.
"""
solution_explanation = """
Reconcile each historical uptake with the chromatograph factor in force on that date, drop aborted rows, map TIC-201 through the calibration table onto the reference probe, and form the hydrogen partial pressure by subtracting the solvent vapor pressure from the absolute headspace pressure. Convert that partial pressure with the solubility table. Use the baffled-vessel gas-liquid and liquid-solid coefficients, and scale the catalytic step by the CO uptake for the charge's catalyst state. The corrected rates identify a Langmuir-Hinshelwood hydrogen rate whose saturated surface coefficient and adsorption coefficient each follow the two-parameter temperature law stated in the campaign note. For a uniform particle the local rate is balanced by steady diffusion in the sphere, and the flux at the outer surface is matched to the two films. The initial rate and the three concentration shares come from that steady state. Consumption over the hold follows the falling hydrogen inventory in the closed headspace, and it stops at zero partial pressure. The reference route estimates the four temperature-law parameters by output-error nonlinear least squares and integrates the hold with a batched finite-volume particle solve. The independent route estimates a surface coefficient and an adsorption coefficient at each measured temperature, fits the two temperature lines, and integrates the same particle balance.
"""
verification_explanation = """
The ground truth is the latent forward model in authoring/provenance/generate_campaign.py, in write_truth, on an 80-node and 200-step finite-volume grid. It is not a fit produced by the reference solution. The hidden campaign is tests/hidden_campaign, and tests/truth/expected.json stores that forward model on the 1539 charges. authoring/evidence/hidden_shift.md records the shift: anisole instead of toluene, a lower diffusivity, larger particles, and stirrer speeds and diameters outside the visible window. The visible week already contains uniform particles, a curved thermocouple, three chromatograph windows, aborted rows, a regenerated catalyst state, and a hold that empties a small headspace. assert_shift in the generator checks that no visible charge is repeated and that those visible conditions are present. A rate is within tolerance when the absolute error is at most the larger of 0.090 times the latent rate and 0.00015 mol m^{-3} s^{-1}. Consumption is within tolerance when the absolute error is at most the larger of 0.060 times the latent consumption and 0.20 mol m^{-3}. A fraction is within tolerance when the absolute error is at most 0.030. The fractions must also sum to 1 within 0.0001. These bands were set from both correct routes on the shipped files. In authoring/evidence/calibration_results.json the output-error route has maximum relative rate error 0.016190195433297267, maximum relative consumption error 0.015714806341945886, and maximum absolute fraction error 0.005447649777511332, and it misses no charge. The per-temperature route has 0.061913835925981354, 0.03516221149907449, and 0.015398319035640817, and it misses no charge. The largest relative rate gap between the two routes is 0.07462261682112255, the largest relative consumption gap is 0.050877017841020375, and the largest absolute fraction gap is 0.018675138688220683. The relative rate tolerance 0.090 lies above the larger truth error and above that cross-route gap. The consumption tolerance 0.060 lies above 0.03516221149907449 and above 0.050877017841020375. The fraction tolerance 0.030 lies above 0.015398319035640817 and above 0.018675138688220683. Every baseline recorded there fails all 1539 charges: constant 0, constant 1, the mean of the latent values, the median of the latent values, and each of bath temperature, gauge pressure, catalyst mass, particle diameter, and stirrer speed copied into every numeric field. The container run of the constant-0 program reported 1539 charges outside the limits. Dropping internal diffusion, using the reference parameters in the algebraic two-film rate, has maximum relative rate error 0.9783627348125193 and leaves 1447 charges outside the bands. Replacing consumption by the initial rate times the hold, with the reference initial state otherwise unchanged, leaves 1468 charges outside. Refitting on the spreadsheet rate column has maximum relative rate error 0.3877605151595768 and misses the rate band on 985 charges. tests/test_outputs.py runs python3 /app/forecast.py on the hidden campaign with a 20 second limit, the same limit stated in instruction.md. In the verifier image on 1 CPU the reference forecast test finished in 8.738 seconds. The 20 second limit is about 2.3 times that run, and the independent program finished in 14.88 seconds. Both received reward 1. The one-charge-at-a-time program in authoring/evidence/naive_forecast.py matches the reference on two charges and, on the full map, was killed at 20 seconds. That timeout fails the run, the partial output is not graded, and the reward was 0. A missing program, a NaN value, and a symlink output also received reward 0. The runner user cannot read /tests.
"""

