schema_version = "1.4"

artifacts = ["/app/output/damage.json"]

[task]
name = "afterquery/laminate-damage-id"
description = "Recover three elliptical midplane-split patches and two edge springs on a compressed GFRP plate from four unlabeled vibration holds, including the closed-branch snap and the open-branch spectrum at 80 N and -90 N."
authors = [{ name = "Nishant Kumar Saroj", email = "nishantsaroj20@gmail.com" }]
keywords = ["composites", "laminates", "damage-identification", "modal-analysis", "inverse-problem", "GFRP", "SHM"]

[metadata]
author_name = "Nishant Kumar Saroj"
author_email = "nishantsaroj20@gmail.com"
author_organization = "Independent Researcher"
author_profile = "https://www.linkedin.com/in/nishant-kumar-saroj-15b536170/"
research_advisor = ""
referred_by = ""
conflicts_of_interest = "None"
domain = "engineering-sciences"
field = "mechanical-engineering"
subfield = "composite structures, vibration-based damage identification"
category = "Science"
subcategory = "Mechanical & Aerospace Engineering"
tags = ["composites", "laminates", "damage-identification", "modal-analysis", "inverse-problem", "GFRP", "SHM"]
expert_time_estimate_hours = 18
relevant_experience = "M.Tech (Engineering Analysis and Design) at IIT Delhi with a thesis on GFRP laminates that combined experimental fatigue/self-heating measurements with Abaqus FE models of laminated plates and progressive damage; previously built a MATLAB plate finite-element solver comparing Kirchhoff, BFS and DKQ elements for static and free-vibration analysis; professional FEA experience in structural analysis of composite components."
difficulty_explanation = "Seeded vibration holds from a nine-mode von Karman GFRP plate. The midplane split between ply 4 and ply 5 keeps its full bending change on the downward preparation and also reduces extensional stiffness on the upward preparation. Three elliptical patches carry the separated area, and the two edge springs share every hold, so a nominal-spring centre scan locks onto a compromise blob. The graded frequencies are at 80 N and -90 N, outside the holds, and the snap is the closed-branch stability loss. A composite structural-health-monitoring engineer, or a structural-dynamics researcher, performs this work in practice."
solution_explanation = "Apply the published open-membrane reduction and the closed-branch bending retention, and match the four measured columns inside each preparation. Scan one centre at a time on the full residual, and refit that patch together with both spring multipliers before searching for the next centre. A 4 mm refinement and two bounded polishes follow. The closed branch is continued until its tangent loses positive definiteness, and the upward preparation is evaluated at 80 N and -90 N. The authored parameters are not a start."
verification_explanation = "Patch geometry and spring multipliers in the truth file are the generator inputs. Five noise-level polishes from the reference fit, the authored parameters, and shifted angles, centres and severities all keep forecast error at or below 3.72e-4. Their largest misses are 0.0099 m in centre, 0.0064 m in a, 0.0038 m in b, 89.9 degrees in orientation, 0.133 in severity, and 0.033 and 0.0034 in the two multipliers. The caps 0.018 m, 0.012 m, 0.008 m, 90 degrees, 0.22 and 0.07 cover that cloud; the orientation cap is the half-period because the valid fits already span it. Snap and forecast caps are 0.0008. A compromise-blob search and an intact-closed or bending-only refit miss the forecast cap. The checks score the JSON file only."

