subcategory = "Mechanical & Aerospace Engineering"
tags = ["composites", "laminates", "damage-identification", "modal-analysis", "inverse-problem", "GFRP", "SHM"]
expert_time_estimate_hours = 18
relevant_experience = "M.Tech (Engineering Analysis and Design) at IIT Delhi with a thesis on GFRP laminates that combined experimental fatigue/self-heating measurements with Abaqus FE models of laminated plates and progressive damage; previously built a MATLAB plate finite-element solver comparing Kirchhoff, BFS and DKQ elements for static and free-vibration analysis; professional FEA experience in structural analysis of composite components."
difficulty_explanation = "The practicing job is a structural dynamics test engineer working on composite plates. One synthetic eight-ply GFRP record set mixes an open upward preparation with a closed downward preparation, withholds four of the lowest seven modes, and leaves two edge-spring multipliers and the branch label unknown. The separated area sits on two ellipses that are exactly zero outside their supports, so a centre that still misses those supports does not move the residual. The graded quantities are the closed-branch stability-loss load and the open-branch spectrum at two forces that were never held. Zone numbers are checked only against the published search bounds."
solution_explanation = "Membrane stiffness stays the intact laminate. Bending is swapped with the preparation sign, each hold is assigned to the lower modal residual, and ellipse centres are scanned before a bounded polish of both zones and both spring multipliers. The negative branch is bisected to the first loss of stability, and the positive branch is evaluated at the two requested forces. Authored zone values are not supplied as the initial guess."
verification_explanation = "The pass rule is not a zone-precision tolerance. Finite centres, axes, severities and both multipliers need only lie in the inclusive bounds, with the major semi-axis longer. Graded fields are the four numeric record signs, the positive snap load, and eight positive ascending frequencies at the prescribed forces, each within relative 0.0005 and a 1e-12 endpoint allowance. Truth for the snap and the forecast is the separate 30 by 26 Newton model. Against the reference condensation the frequency agreement is within 1e-8 and the snap difference is about 5e-7; the reference inversion of the shipped records is near 4.6e-5. The 0.0005 gate is that synthetic contract. Percent-level FRP frequency scatter under material uncertainty does not calibrate it, and random starts that miss the forecast are not an identifiability proof. The checks read the artifact only."

