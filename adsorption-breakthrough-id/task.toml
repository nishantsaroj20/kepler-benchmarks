[metadata]
author_name = "Nishant Saroj"
author_email = "nishantsaroj20@gmail.com"
author_organization = "Independent Researcher"
author_profile = "https://github.com/nishantsaroj20"
conflicts_of_interest = "None"
domain = "engineering-sciences"
field = "chemical-engineering"
subfield = "adsorption separation processes"
category = "Science"
subcategory = "Chemical & Biomolecular Engineering"
tags = ["adsorption", "breakthrough", "parameter-estimation", "langmuir", "fixed-bed"]
expert_time_estimate_hours = 8
relevant_experience = "Independent researcher with graduate-level chemical engineering training focused on adsorption separation processes, fixed-bed modeling, and inverse estimation of isotherm and mass-transfer parameters. Prior work includes method-of-lines treatments of Langmuir–LDF columns with axial dispersion and design calculations that map identified kinetics onto breakthrough purity constraints."
difficulty_explanation = "All sensor traces are synthetic but seeded from a one-dimensional Langmuir–LDF–dispersion PDE with sparse irregular sampling at outlet and mid-bed ports plus substantial concentration noise. In practice this inverse design problem is handled by separation process engineers during adsorbent screening and column sizing. Difficulty arises because axial dispersion and LDF kinetics both broaden the mass-transfer zone, two feed concentrations are required to separate isotherm capacity from affinity, and the held-out minimum length is sensitive to modest parameter error."
solution_explanation = "Seed Langmuir parameters from stoichiometric uptake estimates on both breakthroughs, then fit k_LDF and D_ax (followed by a joint polish of all four unknowns) by method-of-lines simulation against outlet and mid-bed traces with front-weighted residuals. With the identified parameters, binary-search the minimum packed length that keeps the design-duty outlet below the stated mole-fraction limit over the service window, applying a small safety margin for discretization bias."
verification_explanation = "Ground truth parameters and the reference L_min were generated by independent BDF method-of-lines integration with a fixed seed in authoring/provenance; the evaluation checks finite positive JSON fields, relative parameter tolerances (10% qm, 12% K, 20% k_LDF, 30% D_ax), L_min within 10% and not undersized below 0.97 of reference, and true-model outlet feasibility at the proposed length. An independent reimplementation in authoring/evidence recovered oracle score 1 and nop score 0 with matching constraint margins."

