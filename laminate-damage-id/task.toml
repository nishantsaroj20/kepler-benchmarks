subfield = "composite structures, vibration-based damage identification"
category = "Science"
subcategory = "Mechanical & Aerospace Engineering"
tags = ["composites", "laminates", "damage-identification", "modal-analysis", "inverse-problem", "GFRP", "SHM"]
expert_time_estimate_hours = 18
relevant_experience = "M.Tech (Engineering Analysis and Design) at IIT Delhi with a thesis on GFRP laminates that combined experimental fatigue/self-heating measurements with Abaqus FE models of laminated plates and progressive damage; previously built a MATLAB plate finite-element solver comparing Kirchhoff, BFS and DKQ elements for static and free-vibration analysis; professional FEA experience in structural analysis of composite components."
difficulty_explanation = "Seeded vibration holds from a nine-mode von Karman GFRP plate. The midplane split between ply 4 and ply 5 opens only when the first sine coefficient is positive, membrane stiffness stays whole, and two elliptical patches carry the separated area. One bending knockdown for every hold cannot match both preparations. A patch that misses the real ellipse does not move the operators, so a generic local search stops in a decoy basin. The graded frequencies are at 80 N and -90 N, outside the holds, and the snap is the closed-branch stability loss. This is the contact-state and missing-mode problem seen in composite panel monitoring."
solution_explanation = "Keep the intact membrane energy, swap in the open or closed bending operator, and match the four measured columns inside each preparation. A grid of centres with one patch active seeds a bounded least-squares polish of both patches, both spring multipliers and a few angles. The closed branch is continued until its tangent loses positive definiteness, and the upward preparation is evaluated at 80 N and -90 N. The authored parameters are not a start."
verification_explanation = "Patch geometry, spring multipliers and preparation signs in the truth file are the generator inputs, fixed before any search. Snap load and the eight forecast frequencies come from a separate direct-quadrature Newton continuation, not from the reference condensation. Those two forwards agree to 6.4e-10 in frequency and 5.4e-7 in snap. The reference search lands 4.7e-5 and 4.6e-5 away, so the 0.0005 caps are about ten times that gap. A 40 by 36 quadrature is a different published rule and sits outside the cap. The checks score the JSON file only."

