schema_version = "1.4"
artifacts = ["/workspace/output/estimated_parameters.json", "/workspace/output/optimal_feed.json"]

[task]
name = "afterquery/bioreactor-kinetics-inversion"
description = "Estimate fed-batch kinetic parameters under a metabolic phase shift and compute a constrained optimal feed schedule."
authors = [{ name = "Nishant Saroj", email = "nishantsaroj20@gmail.com" }]
keywords = ["fed-batch", "parameter-estimation", "bioprocess", "feed-optimization", "haldane-kinetics"]

[metadata]
author_name = "Nishant Saroj"
author_email = "nishantsaroj20@gmail.com"
author_organization = "Independent Researcher"
author_profile = "https://github.com/nishantsaroj20"
conflicts_of_interest = "None"
domain = "engineering-sciences"
field = "chemical-engineering"
subfield = "bioprocess engineering"
category = "Science"
subcategory = "Chemical & Biomolecular Engineering"
tags = ["fed-batch", "parameter-estimation", "bioprocess", "feed-optimization", "haldane-kinetics"]
expert_time_estimate_hours = 8
relevant_experience = "Independent researcher with graduate-level chemical engineering training focused on bioprocess modeling, nonlinear parameter estimation, and fed-batch fermentation control. Prior work includes implementing unstructured kinetic models (Monod/Haldane with product inhibition), metabolic phase-shift formulations, and mass-balance-constrained dynamic optimization for substrate feeding."
difficulty_explanation = "All telemetry is synthetic but seeded from a stiff five-state fed-batch model with a discontinuous metabolic switch, sparse irregular sampling, and substantial sensor noise including imperfect feed measurements. In practice this class of inverse problem is handled by fermentation scientists and bioprocess engineers during strain/process characterization. Difficulty arises from jointly identifying non-smooth kinetics from limited noisy assays and then solving a constrained dynamic feed optimization whose feasible region is shaped by substrate inhibition and dissolved-oxygen floors."
solution_explanation = "Fit the eight kinetic parameters by simulating the Haldane–Andrews/product-inhibition ODEs against both historical runs (global search then local least-squares, treating measured feed as a noisy zero-order-hold input), then optimize a ten-interval piecewise-constant feed with SLSQP under volume, substrate, and DO penalties to maximize final product mass."
verification_explanation = "Ground truth parameters and a reference feed were generated by independent Radau integration with a fixed seed in authoring/provenance; the verifier re-integrates proposed feeds under the true kinetics and enforces relative parameter tolerances (10% on mu_max/P_crit/alpha/beta, 20% on K_S/K_I, t_switch within 0.5 h), S≤15 g/L (0.5 g/L slack), CL≥0.15 C*, V≤V_max, and minimum product mass 249.33 g. An independent reimplementation in authoring/evidence recovered oracle reward 1 and nop reward 0 with matching constraint margins."

[verifier]
timeout_sec = 900.0
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"

