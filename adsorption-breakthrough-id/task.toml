[task]
name = "afterquery/adsorption-breakthrough-id"
description = "Identify Langmuir–LDF–dispersion parameters from noisy fixed-bed breakthroughs and compute a minimum design packed length."
authors = [{ name = "Nishant Saroj", email = "nishantsaroj20@gmail.com" }]
