schema_version = "1.4"
artifacts = ["/workspace/output/column_solver.py"]

[task]
name = "afterquery/adsorption-breakthrough-id"
description = "Write a timed column solver that identifies Langmuir–LDF–dispersion parameters from breakthroughs and sizes a packed bed on held-out cases from the same condition classes."
authors = [{ name = "Nishant Saroj", email = "nishantsaroj20@gmail.com" }]
keywords = ["adsorption", "breakthrough", "parameter-estimation", "langmuir", "fixed-bed"]

[metadata]
author_name = "Nishant Saroj"
author_email = "nishantsaroj20@gmail.com"
author_organization = "Independent Researcher"
author_profile = "https://github.com/nishantsaroj20"
conflicts_of_interest = "None"
domain = "engineering-sciences"
field = "chemical-engineering"
subfield = "adsorption separation processes"
category = "Science"
subcategory = "Chemical & Biomolecular Engineering"
tags = ["adsorption", "breakthrough", "parameter-estimation", "langmuir", "fixed-bed"]
expert_time_estimate_hours = 8
relevant_experience = "Independent researcher with graduate-level chemical engineering training focused on adsorption separation processes, fixed-bed modeling, and inverse estimation of isotherm and mass-transfer parameters. Prior work includes method-of-lines treatments of Langmuir–LDF columns with axial dispersion and design calculations that map identified kinetics onto breakthrough purity constraints."
difficulty_explanation = "All breakthrough curves and design duties are synthetic: seeded method-of-lines integration of a 1-D Langmuir–LDF–axial-dispersion column with sparse noisy outlet/mid-bed sampling. The curves are realistic for laboratory or pilot fixed-bed adsorber tests. Adsorption process engineers and separation scientists perform this class of inverse sizing work during adsorbent screening and packed-bed design. Difficulty is scientific (D_ax vs k_LDF coupling, mid-bed faults, purity-constrained L_min) under a 120 s / 1 CPU program-under-test budget."
solution_explanation = "Seed Langmuir parameters from PDE-consistent completed-breakthrough uptake on both experiments, then multi-start log-space least-squares of all four unknowns against front-weighted outlet residuals (and cleaned mid-bed points when available) using a method-of-lines BDF column model. Binary-search a feasible packed length for the case design duty with a small safety margin, keeping the MOL grid coarse enough to finish each case within the 120 s per-run limit on one CPU."
verification_explanation = "Verifier runs the submitted program offline in a per-case temp workdir (only that case’s files), python -s, new process group, thread pins, and unprivileged user when root so /tests/hidden and /logs/verifier are inaccessible to the child; CTRF is /logs/verifier/ctrf.json and reward is 0/1. Tolerances: 12% qm, 25% K, 50% k_LDF, 45% D_ax. L_min oversize ceiling 1.30 means L_est ≤ 1.30×L_ref (reject padded beds; calibrated so max measured oracle L_est/L_ref = 1.151, headroom ~0.15). Outlet-feasibility slack 1.03 means true-model max outlet ≤ 1.03×purity limit on independent MOL grids n=48/n=80 (3% numerical scatter; measured max outlet/limit = 0.848). Evidence: authoring/evidence/independent_calibration_report.json from independent_calibration.py. Independent alternate-structure estimator (authoring/evidence/independent_estimator.py: LSODA N=48 equal-weight outlet+mid log10 grid search, not oracle BDF/front-weighted least_squares) passed all five hidden cases with measured relative errors H1 qm/K/k_LDF/D_ax = 0.008/0.020/0.273/0.000, H2 0.000/0.028/0.078/0.121, H3 0.001/0.013/0.026/0.079, H4 0.003/0.017/0.000/0.000, H5 0.004/0.004/0.048/0.073 (independent_estimator_report.json)."

