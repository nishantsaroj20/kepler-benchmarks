expert_time_estimate_hours = 18
relevant_experience = "M.Tech (Engineering Analysis and Design) at IIT Delhi with a thesis on GFRP laminates that combined experimental fatigue/self-heating measurements with Abaqus FE models of laminated plates and progressive damage; previously built a MATLAB plate finite-element solver comparing Kirchhoff, BFS and DKQ elements for static and free-vibration analysis; professional FEA experience in structural analysis of composite components."
difficulty_explanation = "Synthetic vibration holds from a nine-mode von Karman GFRP plate. They are generated from the published breathing-split law, then reduced to four modes out of seven with the preparation label omitted, which is the incompleteness a laboratory modal survey of a compressed panel leaves rather than a complete noise-free spectrum. The midplane split between ply 4 and ply 5 keeps its full bending change on the downward preparation and also reduces extensional stiffness on the upward preparation. Four elliptical patches carry the separated area. A search that places only three of them leaves the fourth centre outside the cap, and the two edge springs share every hold, so a nominal-spring centre scan locks onto a compromise blob. One hold does not include the fundamental. The graded frequencies are at 80 N and -90 N, outside the holds, and the snap is the closed-branch stability loss. A composites structural-dynamics engineer in nondestructive evaluation performs this identification in practice: recover the midplane splits and the unknown edge springs, then forecast the snap and the unheld frequencies."
solution_explanation = "Apply the published open-membrane reduction and the closed-branch bending retention, and match the four measured columns inside each preparation. Scan one centre at a time on the full residual, and refit that patch together with both spring multipliers before searching for the next centre. A 4 mm refinement and two bounded polishes follow. The closed branch is continued until its tangent loses positive definiteness, and the upward preparation is evaluated at 80 N and -90 N. The authored parameters are not a start."
verification_explanation = "Patch geometry and spring multipliers in the truth file are the generator inputs. Snap and forecast come from the direct Newton plate, not the reference condensation. On the authored parameters the two forwards differ by at most 6.3e-10 relative in frequency and 3.4e-7 relative in the snap. An unweighted polish started at those parameters stays within 0.001 m on the centres, 0.01 on severity, snap relative 2.1e-4 and forecast relative 1.4e-4. The sequential search does not start there. It finishes at cost 1.40e-5 with the authored signs, centre misses 0.0186 m and 0.0145 m, semi-axis misses 0.0168 m and 0.0059 m, severity miss 0.071, angle miss 75.6 degrees, spring misses 0.0067 and 0.0040, snap relative 0.00164 and forecast relative 0.00118. The caps sit above that search: centres 0.026 m, a 0.022 m, b 0.010 m, severity 0.40, angle 90 degrees, springs 0.07, snap and forecast 0.0024. Severity and angle stay wide because area trades with severity and this search already uses 76 degrees of the half-period. A 0.16 severity cap is what rejected noise-level inversions of the earlier three-patch plate. The search-interval midpoint matches no patch: the nearest y error is 0.036 m, outside 0.026 m, and the real verifier fails that plate on the zone match. Parking one patch at a corner fails the same centre cap. A structurally separate inverse, authoring/provenance/independent_inverse.py, uses only the direct Newton plate and its own frequency-and-shape residual, starting from corner-parked patches rather than the authored parameters. pytest tests/test_outputs.py scores that JSON as 3 passed, with centre misses 0.0102 m and 0.0142 m, semi-axis misses 0.0145 m and 0.0059 m, severity miss 0.090, angle miss 80.9 degrees, spring misses 0.0067 and 0.0040, snap relative 0.00165 and forecast relative 0.00118. The checks score the JSON file only, and plates must be a one-element array of four zones."

