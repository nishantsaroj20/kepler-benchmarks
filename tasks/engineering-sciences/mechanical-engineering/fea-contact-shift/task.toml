schema_version = "1.4"
artifacts = ["/app/solver/analyze.py"]

[task]
name = "afterquery/fea-contact-shift"
description = "Build a reusable plane-strain frictional contact analyzer that recovers pressure and stick-slip diagnostics on approach-controlled mesh packs, including held-out geometry and friction shifts."
authors = [{ name = "Nishant Kumar Saroj", email = "nishantsaroj20@gmail.com" }]
keywords = ["contact-mechanics", "friction", "stick-slip", "influence-coefficients", "plane-strain"]

[metadata]
author_name = "Nishant Kumar Saroj"
author_email = "nishantsaroj20@gmail.com"
author_organization = "Independent Researcher"
author_profile = "https://www.linkedin.com/in/nishant-kumar-saroj-15b536170/"
conflicts_of_interest = "Author also writes and reviews STEM AI evaluation tasks for other platforms (including Turing, Handshake AI, Alignerr, and Mercor)."
domain = "engineering-sciences"
field = "mechanical-engineering"
subfield = "frictional contact mechanics and FEA-lite stick-slip diagnostics"
category = "Science"
subcategory = "Mechanical & Aerospace Engineering"
tags = ["contact-mechanics", "friction", "stick-slip", "influence-coefficients", "plane-strain", "multi-patch"]
expert_time_estimate_hours = 14
relevant_experience = "Mechanical engineer with an M.Tech in Engineering Analysis & Design at IIT Delhi, focused on scientific computing, numerical methods, and FEA (Python, MATLAB, Abaqus). Experience authoring and evaluating STEM / physical-science AI tasks for Turing, Handshake AI, Alignerr, and Mercor, including executable reference solutions and objective grading criteria."
difficulty_explanation = "Synthetic approach-controlled multi-patch plane-strain frictional contact. Forces are unknowns, so frictionless or delta_t=0 probes cannot copy Ft from the load file. Hardness is elastic patch coupling, incremental Coulomb stick-slip under non-proportional and reversing shear, and the log-kernel operator—not formatting."
solution_explanation = "Assemble the piecewise-constant plane-strain log-kernel influence matrix, then march prescribed delta_n/delta_t with an active-set complementarity solve: Signorini normals plus Coulomb stick/slip with accumulated slip gamma. Report end-of-history pressure, forces, and frictional-field metrics (q peak, stick fraction, slip length, cumulative slip)."
verification_explanation = "Verifier materializes eight held-out packs seeded from submission bytes (shifted geometry/mu/paths, including no-contact), runs analyze.py as unprivileged runner with sealed /tests, and compares to an independent Gauss-quadrature active-set truth. Practice packs are also executed. Tolerances follow measured oracle-versus-Gauss-truth spread; zero/constant and frictionless probes fail."

[verifier]
timeout_sec = 900.0
environment_mode = "separate"

