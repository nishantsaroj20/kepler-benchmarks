[task]
name = "afterquery/laminate-damage-id"
description = "Recover four elliptical midplane-split patches and two edge springs on a compressed GFRP plate from four unlabeled vibration holds, including the closed-branch snap and the open-branch spectrum at 80 N and -90 N."
authors = [{ name = "Nishant Kumar Saroj", email = "nishantsaroj20@gmail.com" }]
keywords = ["composites", "laminates", "damage-identification", "modal-analysis", "inverse-problem", "GFRP", "SHM"]

[metadata]
author_name = "Nishant Kumar Saroj"
author_email = "nishantsaroj20@gmail.com"
author_organization = "Independent Researcher"
author_profile = "https://www.linkedin.com/in/nishant-kumar-saroj-15b536170/"
research_advisor = ""
referred_by = ""
conflicts_of_interest = "None"
domain = "engineering-sciences"
field = "mechanical-engineering"
subfield = "composite structures, vibration-based damage identification"
category = "Science"
subcategory = "Mechanical & Aerospace Engineering"
tags = ["composites", "laminates", "damage-identification", "modal-analysis", "inverse-problem", "GFRP", "SHM"]
expert_time_estimate_hours = 18
relevant_experience = "M.Tech (Engineering Analysis and Design) at IIT Delhi with a thesis on GFRP laminates that combined experimental fatigue/self-heating measurements with Abaqus FE models of laminated plates and progressive damage; previously built a MATLAB plate finite-element solver comparing Kirchhoff, BFS and DKQ elements for static and free-vibration analysis; professional FEA experience in structural analysis of composite components."
difficulty_explanation = "Synthetic vibration holds from a nine-mode von Karman GFRP plate. They are generated from the published breathing-split law, then reduced to four modes out of seven with the preparation label omitted, which is the incompleteness a laboratory modal survey of a compressed panel leaves rather than a complete noise-free spectrum. The midplane split between ply 4 and ply 5 keeps its full bending change on the downward preparation and also reduces extensional stiffness on the upward preparation. Four elliptical patches carry the separated area. A search that places only three of them leaves the fourth centre outside the cap, and the two edge springs share every hold, so a nominal-spring centre scan locks onto a compromise blob. One hold does not include the fundamental. A polish that keeps the angle, area and severity it first accepted misses the snap and forecast limits. The graded frequencies are at 80 N and -90 N, outside the holds, and the snap is the closed-branch stability loss. A composites structural-dynamics engineer in nondestructive evaluation performs this identification in practice: recover the midplane splits and the unknown edge springs, then forecast the snap and the unheld frequencies."
solution_explanation = "Apply the published open-membrane reduction and the closed-branch bending retention, and match the four measured columns inside each preparation. Scan one centre at a time on the full residual, and refit that patch together with both spring multipliers before searching for the next centre. A 4 mm refinement and two bounded polishes follow. Each patch is then tried on a grid of major axes, severities and angles, and the lower residual is polished again. The closed branch is continued until its tangent loses positive definiteness, and the upward preparation is evaluated at 80 N and -90 N. The authored parameters are not a start."
verification_explanation = "Patch geometry and spring multipliers in the truth file are the generator inputs. Snap and forecast come from the direct Newton plate, not the reference condensation. On the authored parameters the two forwards differ by at most 6.3e-10 relative in frequency and 3.4e-7 relative in the snap. An unweighted polish started at those parameters stays within 0.001 m on the centres, 0.01 on severity, snap relative 2.1e-4 and forecast relative 1.4e-4. The reference search does not start there. After a grid over major axis, severity and angle it finishes at cost 4.24e-6 with the authored signs, centre misses 0.0158 m and 0.0125 m, snap relative 2.57e-4 and forecast relative 2.00e-4. A continuous polish that skips that grid stays at snap relative 1.46e-3 and forecast relative 9.85e-4, and pytest rejects it on the snap. Geometry caps stay wide: centres 0.026 m, a 0.022 m, b 0.010 m, severity 0.40, angle 90 degrees, springs 0.07. The snap cap is 0.00115 and the forecast cap is 0.00080. Angle acceptance is 90 degrees because a 180-degree flip is the same major axis. The reference misses one angle by 55 degrees and the direct inverse by 49 degrees. Severity stays at 0.40 because the direct inverse misses one severity by 0.195, and a 0.16 cap rejected noise-level inversions of the earlier three-patch plate. The search-interval midpoint matches no patch: the nearest y error is 0.036 m, outside 0.026 m, and the real verifier fails that plate on the zone match. Parking one patch at a corner fails the same centre cap. A structurally separate inverse, authoring/provenance/independent_inverse.py, uses only the direct Newton plate and its own frequency-and-shape residual, starting from corner-parked patches rather than the authored parameters. pytest tests/test_outputs.py scores that JSON as 6 passed, with centre misses 0.0099 m and 0.0138 m, semi-axis misses 0.0145 m and 0.0060 m, severity miss 0.195, angle miss 49.1 degrees, spring misses 0.0089 and 0.0018, snap relative 0.000873 and forecast relative 0.000622. The checks score the JSON file only, and plates must be a one-element array of four zones. A separate noise-scaled fit uses relative frequency residuals and profiles signed shape scale by projection. The fit selected by observation residual passes all six current checks, with severity miss 0.185, snap relative error 2.29e-4 and forecast error 2.10e-4. Four poorer fits and their verifier outcomes are recorded. Zone pairing now identifies the limiting field, and fixture, signs, snap and forecast checks report separately."

